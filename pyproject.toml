[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = [
    "E", "F", "W",     # pyflakes + pep8
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # flake8-bugbear
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["alembic/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
